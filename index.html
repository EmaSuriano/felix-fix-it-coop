<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Felix Fix-It Coop</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>

<div id="overlay">
  <div id="card">
    <p class="kicker">Fix-It Felix Jr.</p>
    <h1>CO-OP</h1>
    <p class="sub">Two Felixes, one building. Create a game or join with a room code.</p>

    <div id="menuMain">
      <div class="row">
        <button class="primary" id="createBtn">Create Game</button>
      </div>
      <div class="row">
        <button id="joinMenuBtn">Join Game</button>
      </div>
    </div>

    <div id="createPanel">
      <label>Room code</label>
      <div id="codeDisplay">------</div>
      <label>Share this link</label>
      <div id="linkBox">
        <input type="text" id="linkInput" readonly>
        <button id="copyBtn">Copy</button>
      </div>
      <p class="hint">Waiting on the other player. Keep this tab open.</p>
      <button id="createBack" type="button">Back</button>
    </div>

    <div id="joinPanel">
      <label>Room code</label>
      <input type="text" id="joinCode" maxlength="8" placeholder="abc123" autocomplete="off" spellcheck="false">
      <div class="row" style="margin-top:12px">
        <button class="primary" id="joinBtn">Join Game</button>
      </div>
      <button id="joinBack" type="button">Back</button>
    </div>

    <div id="status"></div>
  </div>
</div>

<div id="gameWrap">
  <div id="hud">
    <span class="you">■ YOU</span>
    <span id="youName">Host</span>
    pts <span id="youScore">0</span>
    lives <span id="youLives">3</span>
    &nbsp;|&nbsp;
    <span class="peer">■ PEER</span>
    <span id="peerName">Guest</span>
    pts <span id="peerScore">0</span>
    lives <span id="peerLives">3</span>
    &nbsp;|&nbsp;
    connected: <span id="peerCount">0</span>
    &nbsp;|&nbsp; WASD / Arrows move · Space / J hammer
  </div>
  <canvas id="gameCanvas"></canvas>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
